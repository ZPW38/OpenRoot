name: Android CI

# Builds a directly installable debug-signed APK.
#
# Fork-friendly on purpose: the upstream release flow needs SIGNING_KEY / ALIAS /
# KEY_STORE_PASSWORD / KEY_PASSWORD secrets, which a fresh fork does not have. A debug signature
# is enough to sideload the app, so this workflow signs with the default debug keystore and uploads
# the APK as an artifact — no secrets to configure.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 临时 root 载荷（native/）需要用 NDK r27d 交叉编译成 arm64 二进制
    - name: Set up NDK
      id: setup-ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r27d
        add-to-path: false

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build debug APK
      run: ./gradlew assembleDebug
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

    - name: Show APK
      run: ls -la app/build/outputs/apk/debug/

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: OpenRoot-debug
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
